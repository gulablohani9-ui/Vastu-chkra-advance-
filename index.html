<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vastu Chakra App Advance</title>
    <!-- PDF बनाने के लिए jsPDF लाइब्रेरी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 15px; text-align: center; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, button, select { width: 90%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-green { background-color: #28a745; }
        .btn-red { background-color: #dc3545; width: 45%; margin-top: 10px;}
        .btn-blue { background-color: #17a2b8; margin-top: 10px; padding: 15px; font-size: 18px;}
        canvas { border: 2px solid #333; background-color: white; max-width: 100%; border-radius: 5px; margin-top: 10px; }
        .cut-row { display: flex; justify-content: space-between; align-items: center; background: #eee; padding: 5px; margin-top: 5px; border-radius: 5px;}
        input[type=range] { width: 90%; margin: 15px 0; }
    </style>
</head>
<body>

    <h2>Vastu Chakra App</h2>

    <!-- Option: Plot Size -->
    <div class="card">
        <h3>1. प्लॉट का साइज़ (फीट में)</h3>
        <input type="number" id="plotWidth" placeholder="चौड़ाई X (उदा. 20)">
        <input type="number" id="plotLength" placeholder="लंबाई Y (उदा. 22)">
    </div>

    <!-- Option: Special Cuts -->
    <div class="card">
        <h3>2. स्पेशल कट्स (कटे हुए कोने)</h3>
        <select id="cutCorner">
            <option value="NW">North-West (वायव्य) कट</option>
            <option value="NE">North-East (ईशान) कट</option>
            <option value="SE">South-East (आग्नेय) कट</option>
            <option value="SW">South-West (नैऋत्य) कट</option>
        </select>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <input type="number" id="cutX" placeholder="X कट (फीट)">
            <input type="number" id="cutY" placeholder="Y कट (फीट)">
        </div>
        <button type="button" onclick="addCut()" style="background-color: #6c757d;">+ कट जोड़ें</button>
        <div id="cutList"></div>
    </div>

    <!-- Compass Degree -->
    <div class="card">
        <h3>3. दिशा (Degree)</h3>
        <input type="number" id="degree" placeholder="डिग्री डालें (उदा. 90)" oninput="drawPlot()">
        <button onclick="getAutoDegree()" style="background-color: #ff9800;">Auto Degree लें (Sensor)</button>
    </div>

    <!-- Chakra Folder Upload -->
    <div class="card">
        <h3>4. वास्तु चक्र फोल्डर चुनें</h3>
        <input type="file" id="chakraFolder" accept="image/*" multiple webkitdirectory>
        <p id="chakraCount" style="color: green; font-weight: bold;"></p>
        
        <label><b>चक्र को घुमाएं (Manual Rotation):</b></label>
        <br>
        <input type="range" id="manualRotate" min="-180" max="180" value="0" oninput="drawPlot()">
    </div>

    <!-- Actions -->
    <button class="btn-green" onclick="drawPlot()">प्लॉट और चक्र दिखाएं</button>
    <button class="btn-blue" onclick="generatePDF()">HD PDF डाउनलोड करें</button>
    <button class="btn-red" onclick="resetAll()">Reset</button>

    <!-- Canvas (Resolution doubled for HD PDF) -->
    <div class="card">
        <canvas id="appCanvas" width="700" height="800" style="width: 100%; height: auto;"></canvas>
    </div>

    <script>
        let canvas = document.getElementById('appCanvas');
        let ctx = canvas.getContext('2d');
        let cutsArray = [];
        let chakrasArray = [];

        document.getElementById('chakraFolder').addEventListener('change', function(e) {
            chakrasArray = [];
            let files = e.target.files;
            let loadedCount = 0;
            
            for(let i = 0; i < files.length; i++) {
                if(files[i].type.match('image.*')) {
                    let reader = new FileReader();
                    reader.onload = function(event) {
                        let img = new Image();
                        img.onload = function() {
                            chakrasArray.push(img);
                            loadedCount++;
                            document.getElementById('chakraCount').innerText = loadedCount + " चक्र लोड हो गए!";
                            if(loadedCount === 1) drawPlot();
                        }
                        img.src = event.target.result;
                    }
                    reader.readAsDataURL(files[i]);
                }
            }
        });

        function getAutoDegree() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', function(event) {
                    let alpha = event.alpha;
                    if(alpha !== null) { 
                        document.getElementById('degree').value = Math.round(360 - alpha); 
                        drawPlot();
                    }
                }, {once: true});
                alert("फोन को प्लॉट की फेसिंग की तरफ करें।");
            } else { alert("सेंसर सपोर्ट नहीं कर रहा है।"); }
        }

        function addCut() {
            let corner = document.getElementById('cutCorner').value;
            let cx = parseFloat(document.getElementById('cutX').value);
            let cy = parseFloat(document.getElementById('cutY').value);
            
            if(!cx || !cy) { alert("कृपया कट का नाप (X और Y) डालें!"); return; }
            cutsArray.push({ corner: corner, x: cx, y: cy });
            updateCutListUI();
            drawPlot();
        }

        function updateCutListUI() {
            let html = "";
            cutsArray.forEach((c, index) => {
                html += `<div class="cut-row"><b>${c.corner}</b>: ${c.x}ft x ${c.y}ft <button onclick="removeCut(${index})" style="width: auto; padding: 5px; background: red; margin: 0;">X</button></div>`;
            });
            document.getElementById('cutList').innerHTML = html;
        }

        function removeCut(index) { cutsArray.splice(index, 1); updateCutListUI(); drawPlot(); }

        function resetAll() {
            cutsArray = []; chakrasArray = [];
            updateCutListUI();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('plotWidth').value = '';
            document.getElementById('plotLength').value = '';
            document.getElementById('degree').value = '';
            document.getElementById('chakraCount').innerText = '';
        }

        function getPlotPolygon(W, L, cuts) {
            let pts = [];
            let nw = cuts.find(c => c.corner === 'NW');
            if(nw) { pts.push({x: 0, y: nw.y}); pts.push({x: nw.x, y: nw.y}); pts.push({x: nw.x, y: 0}); } else { pts.push({x: 0, y: 0}); }
            let ne = cuts.find(c => c.corner === 'NE');
            if(ne) { pts.push({x: W - ne.x, y: 0}); pts.push({x: W - ne.x, y: ne.y}); pts.push({x: W, y: ne.y}); } else { pts.push({x: W, y: 0}); }
            let se = cuts.find(c => c.corner === 'SE');
            if(se) { pts.push({x: W, y: L - se.y}); pts.push({x: W - se.x, y: L - se.y}); pts.push({x: W - se.x, y: L}); } else { pts.push({x: W, y: L}); }
            let sw = cuts.find(c => c.corner === 'SW');
            if(sw) { pts.push({x: sw.x, y: L}); pts.push({x: sw.x, y: L - sw.y}); pts.push({x: 0, y: L - sw.y}); } else { pts.push({x: 0, y: L}); }
            return pts;
        }

        function getCentroid(pts) {
            let twicearea = 0, x = 0, y = 0, nPts = pts.length, p1, p2, f;
            for (let i = 0, j = nPts - 1; i < nPts; j = i++) {
                p1 = pts[i]; p2 = pts[j];
                f = p1.x * p2.y - p2.x * p1.y;
                twicearea += f;
                x += (p1.x + p2.x) * f; y += (p1.y + p2.y) * f;
            }
            f = twicearea * 3;
            return { x: Math.abs(x / f), y: Math.abs(y / f) };
        }

        // drawPlot function ab specific chakra image input le sakti hai PDF ke loop ke liye
        function drawPlot(specificChakra = null) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let W = parseFloat(document.getElementById('plotWidth').value);
            let L = parseFloat(document.getElementById('plotLength').value);
            let degree = parseFloat(document.getElementById('degree').value) || 0;
            let manualRotate = parseFloat(document.getElementById('manualRotate').value) || 0;

            if(!W || !L) { return; }

            // Canvas HD hone ke karan scaling badha di gayi hai
            let scale = Math.min(600 / W, 700 / L);
            let offsetX = (canvas.width - (W * scale)) / 2;
            let offsetY = (canvas.height - (L * scale)) / 2;

            let polygonPts = getPlotPolygon(W, L, cutsArray);
            
            ctx.beginPath();
            ctx.moveTo(offsetX + polygonPts[0].x * scale, offsetY + polygonPts[0].y * scale);
            for(let i=1; i<polygonPts.length; i++) {
                ctx.lineTo(offsetX + polygonPts[i].x * scale, offsetY + polygonPts[i].y * scale);
            }
            ctx.closePath();
            ctx.lineWidth = 4; ctx.strokeStyle = "#333"; ctx.fillStyle = "#f8f9fa";
            ctx.fill(); ctx.stroke();

            let centroid = getCentroid(polygonPts);
            let cx = offsetX + centroid.x * scale;
            let cy = offsetY + centroid.y * scale;

            // Image Render
            let currentChakra = specificChakra || (chakrasArray.length > 0 ? chakrasArray[0] : null);
            if(currentChakra) {
                ctx.save();
                ctx.translate(cx, cy);
                let totalRotation = (-degree + manualRotate) * Math.PI / 180;
                ctx.rotate(totalRotation);
                let chakraSize = Math.max(W * scale, L * scale) * 1.2; 
                ctx.drawImage(currentChakra, -chakraSize/2, -chakraSize/2, chakraSize, chakraSize);
                ctx.restore();
            }

            // Center Point aur N Arrow
            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, 2 * Math.PI);
            ctx.fillStyle = "red"; ctx.fill();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((-degree * Math.PI) / 180); 
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -90); 
            ctx.strokeStyle = "red"; ctx.lineWidth = 3; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(0, -100); ctx.lineTo(-10, -80); ctx.lineTo(10, -80);
            ctx.fillStyle = "red"; ctx.fill();
            
            ctx.font = "24px Arial"; ctx.fillText("N", -8, -110);
            ctx.restore();
        }

        // Multi-page PDF generate karne ka function
        async function generatePDF() {
            if (!window.jspdf) {
                alert("PDF सिस्टम लोड हो रहा है, कृपया इंटरनेट चालू रखें और 2 सेकंड रुकें।");
                return;
            }
            if (chakrasArray.length === 0) {
                alert("कृपया पहले वास्तु चक्र फोल्डर अपलोड करें ताकि PDF में इमेजेज आ सकें!");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4'); // A4 size page
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();

            // A4 page par photo ko center karne ke liye dimensions
            const imgWidth = 180; 
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            const x = (pageWidth - imgWidth) / 2;
            const y = (pageHeight - imgHeight) / 2;

            for (let i = 0; i < chakrasArray.length; i++) {
                // Background me har ek chakra ko बारी-बारी से draw karna
                drawPlot(chakrasArray[i]);
                
                // Canvas ko HD image me badalna
                let imgData = canvas.toDataURL('image/png', 1.0);
                
                if (i > 0) {
                    doc.addPage(); // Pehle page ke baad naye pages jodna
                }
                
                doc.addImage(imgData, 'PNG', x, y, imgWidth, imgHeight);
            }

            // PDF Save / Download
            doc.save("Vastu_Report.pdf");
            
            // Wapas pehli image par UI reset karna
            drawPlot(); 
        }
    </script>
</body>
</html>
