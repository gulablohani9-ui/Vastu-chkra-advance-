<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vastu Chakra App Advance</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 15px; text-align: center; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, button, select { width: 90%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-green { background-color: #28a745; }
        .btn-red { background-color: #dc3545; width: 45%; margin-top: 10px;}
        .btn-blue { background-color: #17a2b8; margin-top: 10px; padding: 15px; font-size: 18px;}
        canvas { border: 2px solid #333; background-color: white; max-width: 100%; border-radius: 5px; margin-top: 10px; }
        .cut-row { display: flex; justify-content: space-between; align-items: center; background: #eee; padding: 5px; margin-top: 5px; border-radius: 5px;}
        .rot-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 5px; }
        .rot-btn { width: 50px; background-color: #6c757d; font-size: 18px; padding: 10px; }
        input[type=range] { width: 100%; margin: 10px 0; }
        .slider-label { font-size: 14px; font-weight: bold; color: #333; margin-top: 10px; display: block; text-align: left; }
    </style>
</head>
<body>

    <h2>Vastu Chakra App</h2>

    <!-- Option 1: Plot Image from Gallery -->
    <div class="card">
        <h3>1. प्लॉट की फोटो डालें (गैलरी से)</h3>
        <p style="font-size: 12px; color: gray;">(यह फोटो आपके डाले गए साइज़ के अनुसार सेट हो जाएगी)</p>
        <input type="file" id="galleryUpload" accept="image/*">
        
        <label class="slider-label">फोटो को ज़ूम (Zoom In/Out) करें:</label>
        <input type="range" id="bgScale" min="0.5" max="3" step="0.05" value="1" oninput="drawPlot()">
        
        <button class="btn-red" onclick="removeGalleryImage()" style="width: auto; padding: 8px 15px; font-size: 14px; margin-top: 5px;">फोटो हटाएं</button>
    </div>

    <!-- Option 2: Plot Size -->
    <div class="card">
        <h3>2. प्लॉट का साइज़ (फीट में)</h3>
        <input type="number" id="plotWidth" placeholder="चौड़ाई X (उदा. 20)" oninput="drawPlot()">
        <input type="number" id="plotLength" placeholder="लंबाई Y (उदा. 22)" oninput="drawPlot()">
    </div>

    <!-- Option 3: Special Cuts -->
    <div class="card">
        <h3>3. स्पेशल कट्स (कटे हुए कोने)</h3>
        <select id="cutCorner">
            <option value="NW">North-West (वायव्य) कट</option>
            <option value="NE">North-East (ईशान) कट</option>
            <option value="SE">South-East (आग्नेय) कट</option>
            <option value="SW">South-West (नैऋत्य) कट</option>
        </select>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <input type="number" id="cutX" placeholder="X कट (फीट)">
            <input type="number" id="cutY" placeholder="Y कट (फीट)">
        </div>
        <button type="button" onclick="addCut()" style="background-color: #6c757d;">+ कट जोड़ें</button>
        <div id="cutList"></div>
    </div>

    <!-- Option 4: Compass Degree -->
    <div class="card">
        <h3>4. प्लॉट की दिशा (Degree)</h3>
        <input type="number" id="degree" placeholder="डिग्री डालें (उदा. 90)" oninput="drawPlot()">
        <button onclick="getAutoDegree()" style="background-color: #ff9800;">Auto Degree लें (Sensor)</button>
    </div>

    <!-- Option 5: Chakra Selection & Rotation -->
    <div class="card" style="background-color: #e9ecef;">
        <h3>5. वास्तु चक्र सेटिंग्स</h3>
        
        <label class="slider-label">फोल्डर अपलोड करें:</label>
        <input type="file" id="chakraFolder" accept="image/*" multiple webkitdirectory>
        <p id="chakraCount" style="color: green; font-weight: bold;"></p>
        
        <label class="slider-label">चक्र चुनें (देखने/घुमाने के लिए):</label>
        <select id="chakraSelector" onchange="changeChakra()"></select>

        <label class="slider-label">चक्र को ज़ूम (Zoom) करें:</label>
        <input type="range" id="chakraScale" min="0.3" max="3" step="0.05" value="1" oninput="updateChakraScale()">

        <label class="slider-label">चक्र को घुमाएं (Rotation):</label>
        <div class="rot-container">
            <button class="rot-btn" onclick="adjustRotation(-1)">-1°</button>
            <input type="range" id="manualRotate" min="-180" max="180" value="0" oninput="updateRotation()" style="width: 50%;">
            <button class="rot-btn" onclick="adjustRotation(1)">+1°</button>
        </div>
        <p style="margin-top: 5px;">रोटेशन: <span id="rotValue" style="font-weight:bold; color:red;">0</span>°</p>
    </div>

    <!-- Actions -->
    <button class="btn-green" onclick="drawPlot()">स्क्रीन अपडेट करें</button>
    <button class="btn-blue" id="pdfBtn" onclick="generatePDF()">HD PDF बनाएं (Downloads में)</button>
    <button class="btn-red" onclick="resetAll()" style="width: 90%;">पूरी ऐप Reset करें</button>

    <!-- Canvas -->
    <div class="card">
        <canvas id="appCanvas" width="700" height="800" style="width: 100%; height: auto;"></canvas>
    </div>

    <script>
        let canvas = document.getElementById('appCanvas');
        let ctx = canvas.getContext('2d');
        let cutsArray = [];
        let chakrasArray = []; 
        let uploadedBgImage = null;

        document.getElementById('galleryUpload').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    let img = new Image();
                    img.onload = function() { uploadedBgImage = img; drawPlot(); }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function removeGalleryImage() {
            uploadedBgImage = null;
            document.getElementById('galleryUpload').value = "";
            document.getElementById('bgScale').value = 1;
            drawPlot();
        }

        document.getElementById('chakraFolder').addEventListener('change', function(e) {
            chakrasArray = [];
            document.getElementById('chakraSelector').innerHTML = '';
            
            let files = Array.from(e.target.files).filter(f => f.type.match('image.*'));
            files.sort((a,b) => a.name.localeCompare(b.name)); 
            
            let loadedCount = 0;
            files.forEach((file, index) => {
                let reader = new FileReader();
                reader.onload = function(event) {
                    let img = new Image();
                    img.onload = function() {
                        chakrasArray.push({ img: img, name: file.name, rot: 0, scale: 1 });
                        loadedCount++;
                        document.getElementById('chakraCount').innerText = loadedCount + " इमेजेज लोड हो गईं!";
                        
                        let sel = document.getElementById('chakraSelector');
                        let opt = document.createElement('option');
                        opt.value = chakrasArray.length - 1;
                        opt.text = file.name;
                        sel.appendChild(opt);

                        if(loadedCount === 1) { 
                            sel.value = 0; 
                            changeChakra(); 
                        }
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            });
        });

        function changeChakra() {
            let idx = document.getElementById('chakraSelector').value;
            if(chakrasArray[idx]) {
                document.getElementById('manualRotate').value = chakrasArray[idx].rot;
                document.getElementById('rotValue').innerText = chakrasArray[idx].rot;
                document.getElementById('chakraScale').value = chakrasArray[idx].scale || 1;
                drawPlot();
            }
        }

        function updateRotation() {
            let idx = document.getElementById('chakraSelector').value;
            if(chakrasArray[idx]) {
                let val = parseFloat(document.getElementById('manualRotate').value);
                chakrasArray[idx].rot = val;
                document.getElementById('rotValue').innerText = val;
                drawPlot();
            }
        }

        function adjustRotation(amount) {
            let idx = document.getElementById('chakraSelector').value;
            if(chakrasArray[idx]) {
                let val = chakrasArray[idx].rot + amount;
                if(val > 180) val = -180;
                if(val < -180) val = 180;
                chakrasArray[idx].rot = val;
                document.getElementById('manualRotate').value = val;
                document.getElementById('rotValue').innerText = val;
                drawPlot();
            }
        }

        function updateChakraScale() {
            let idx = document.getElementById('chakraSelector').value;
            if(chakrasArray[idx]) {
                chakrasArray[idx].scale = parseFloat(document.getElementById('chakraScale').value);
                drawPlot();
            }
        }

        function getAutoDegree() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', function(event) {
                    let alpha = event.alpha;
                    if(alpha !== null) { 
                        document.getElementById('degree').value = Math.round(alpha); 
                        drawPlot();
                    }
                }, {once: true});
                alert("फोन को प्लॉट की फेसिंग की तरफ करें।");
            } else { alert("सेंसर सपोर्ट नहीं कर रहा है।"); }
        }

        function addCut() {
            let corner = document.getElementById('cutCorner').value;
            let cx = parseFloat(document.getElementById('cutX').value);
            let cy = parseFloat(document.getElementById('cutY').value);
            
            if(!cx || !cy) { alert("कृपया कट का नाप (X और Y) डालें!"); return; }
            cutsArray.push({ corner: corner, x: cx, y: cy });
            updateCutListUI();
            drawPlot();
        }

        function updateCutListUI() {
            let html = "";
            cutsArray.forEach((c, index) => {
                html += `<div class="cut-row"><b>${c.corner}</b>: ${c.x}ft x ${c.y}ft <button onclick="removeCut(${index})" style="width: auto; padding: 5px; background: red; margin: 0;">X</button></div>`;
            });
            document.getElementById('cutList').innerHTML = html;
        }

        function removeCut(index) { cutsArray.splice(index, 1); updateCutListUI(); drawPlot(); }

        function resetAll() {
            cutsArray = []; chakrasArray = []; uploadedBgImage = null;
            updateCutListUI();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('plotWidth').value = '';
            document.getElementById('plotLength').value = '';
            document.getElementById('degree').value = '';
            document.getElementById('galleryUpload').value = '';
            document.getElementById('bgScale').value = 1;
            document.getElementById('chakraFolder').value = '';
            document.getElementById('chakraCount').innerText = '';
            document.getElementById('chakraSelector').innerHTML = '';
            document.getElementById('manualRotate').value = '0';
            document.getElementById('chakraScale').value = '1';
            document.getElementById('rotValue').innerText = '0';
        }

        function getPlotPolygon(W, L, cuts) {
            let pts = [];
            let nw = cuts.find(c => c.corner === 'NW');
            if(nw) { pts.push({x: 0, y: nw.y}); pts.push({x: nw.x, y: nw.y}); pts.push({x: nw.x, y: 0}); } else { pts.push({x: 0, y: 0}); }
            let ne = cuts.find(c => c.corner === 'NE');
            if(ne) { pts.push({x: W - ne.x, y: 0}); pts.push({x: W - ne.x, y: ne.y}); pts.push({x: W, y: ne.y}); } else { pts.push({x: W, y: 0}); }
            let se = cuts.find(c => c.corner === 'SE');
            if(se) { pts.push({x: W, y: L - se.y}); pts.push({x: W - se.x, y: L - se.y}); pts.push({x: W - se.x, y: L}); } else { pts.push({x: W, y: L}); }
            let sw = cuts.find(c => c.corner === 'SW');
            if(sw) { pts.push({x: sw.x, y: L}); pts.push({x: sw.x, y: L - sw.y}); pts.push({x: 0, y: L - sw.y}); } else { pts.push({x: 0, y: L}); }
            return pts;
        }

        function getCentroid(pts) {
            let twicearea = 0, x = 0, y = 0, nPts = pts.length, p1, p2, f;
            for (let i = 0, j = nPts - 1; i < nPts; j = i++) {
                p1 = pts[i]; p2 = pts[j];
                f = p1.x * p2.y - p2.x * p1.y;
                twicearea += f;
                x += (p1.x + p2.x) * f; y += (p1.y + p2.y) * f;
            }
            f = twicearea * 3;
            return { x: Math.abs(x / f), y: Math.abs(y / f) };
        }

        function drawPlot(specificChakraObj = null) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let W = parseFloat(document.getElementById('plotWidth').value);
            let L = parseFloat(document.getElementById('plotLength').value);
            let degree = parseFloat(document.getElementById('degree').value) || 0;

            if(!W || !L) { return; }

            let scale = Math.min(600 / W, 700 / L);
            let offsetX = (canvas.width - (W * scale)) / 2;
            let offsetY = (canvas.height - (L * scale)) / 2;

            let polygonPts = getPlotPolygon(W, L, cutsArray);
            let centroid = getCentroid(polygonPts);
            let cx = offsetX + centroid.x * scale;
            let cy = offsetY + centroid.y * scale;
            
            ctx.beginPath();
            ctx.moveTo(offsetX + polygonPts[0].x * scale, offsetY + polygonPts[0].y * scale);
            for(let i=1; i<polygonPts.length; i++) {
                ctx.lineTo(offsetX + polygonPts[i].x * scale, offsetY + polygonPts[i].y * scale);
            }
            ctx.closePath();

            ctx.save();
            ctx.clip(); 

            if (uploadedBgImage) {
                let bgS = parseFloat(document.getElementById('bgScale').value) || 1;
                ctx.save();
                ctx.translate(cx, cy); 
                ctx.scale(bgS, bgS);
                ctx.translate(-cx, -cy);
                ctx.drawImage(uploadedBgImage, offsetX, offsetY, W * scale, L * scale);
                ctx.restore();
            } else {
                ctx.fillStyle = "#f8f9fa";
                ctx.fill();
            }
            ctx.restore(); 

            ctx.lineWidth = 4;
            ctx.strokeStyle = "#333";
            ctx.stroke();

            let idx = document.getElementById('chakraSelector').value;
            let currentChakra = specificChakraObj || (chakrasArray[idx] ? chakrasArray[idx] : null);
            
            if(currentChakra) {
                ctx.save();
                ctx.translate(cx, cy);
                
                let totalRotation = (degree + currentChakra.rot) * Math.PI / 180;
                ctx.rotate(totalRotation);
                
                let chkS = currentChakra.scale || 1;
                let chakraSize = Math.max(W * scale, L * scale) * 1.2 * chkS; 
                ctx.drawImage(currentChakra.img, -chakraSize/2, -chakraSize/2, chakraSize, chakraSize);
                
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, 2 * Math.PI);
            ctx.fillStyle = "red"; ctx.fill();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((degree * Math.PI) / 180); 
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -90); 
            ctx.strokeStyle = "red"; ctx.lineWidth = 3; ctx.stroke();
            
            ctx.beginPath(); ctx.moveTo(0, -100); ctx.lineTo(-10, -80); ctx.lineTo(10, -80);
            ctx.fillStyle = "red"; ctx.fill();
            
            ctx.font = "24px Arial"; ctx.fillText("N", -8, -110);
            ctx.restore();
        }

        async function generatePDF() {
            if (!window.jspdf) {
                alert("PDF सिस्टम लोड हो रहा है, कृपया इंटरनेट चालू रखें।");
                return;
            }
            if (chakrasArray.length === 0) {
                alert("कृपया पहले वास्तु चक्र फोल्डर अपलोड करें ताकि PDF में इमेजेज आ सकें!");
                return;
            }

            let btn = document.getElementById('pdfBtn');
            btn.innerText = "PDF बन रहा है... कृपया रुकें!";
            btn.style.backgroundColor = "#ffc107"; 
            
            await new Promise(resolve => setTimeout(resolve, 500));

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();

                const imgWidth = 180; 
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                const x = (pageWidth - imgWidth) / 2;
                const y = (pageHeight - imgHeight) / 2;

                for (let i = 0; i < chakrasArray.length; i++) {
                    drawPlot(chakrasArray[i]); 
                    let imgData = canvas.toDataURL('image/png', 1.0);
                    
                    if (i > 0) doc.addPage();
                    doc.addImage(imgData, 'PNG', x, y, imgWidth, imgHeight);
                }

                // Capacitor App Environment Check
                if (window.Capacitor && Capacitor.Plugins.Filesystem) {
                    let pdfBase64 = doc.output('datauristring');
                    let base64Data = pdfBase64.split(',')[1];
                    let fileName = "Vastu_Report_" + new Date().getTime() + ".pdf";

                    await Capacitor.Plugins.Filesystem.writeFile({
                        path: fileName,
                        data: base64Data,
                        directory: Capacitor.Plugins.FilesystemDirectory.Documents, 
                        // Documents Directory usually saves in Download or Documents folder in Android
                    });
                    
                    alert("PDF सफलतापूर्वक डाउनलोड हो गई है! (File Manager me check karein)");

                } else {
                    // Browser Fallback (if not compiled as APK)
                    doc.save("Vastu_Report.pdf");
                }
            } catch (error) {
                alert("कुछ तकनीकी समस्या आई: " + error.message);
            }

            btn.innerText = "HD PDF बनाएं (Downloads में)";
            btn.style.backgroundColor = "#17a2b8";
            drawPlot(); 
        }
    </script>
</body>
</html>
